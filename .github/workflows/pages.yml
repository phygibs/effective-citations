name: Deploy calculator to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build: ${{ steps.snapshot.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - id: snapshot
        name: Check the INSPIRE snapshot
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python snapshot.py --repository "$GITHUB_REPOSITORY" --site "$PAGES_URL"
          else
            python snapshot.py --repository "$GITHUB_REPOSITORY"
          fi
      - if: steps.snapshot.outputs.build == 'true'
        run: python -m pip install -r requirements.txt
      - if: steps.snapshot.outputs.build == 'true'
        run: python effective_citations.py --rates 0.5 1
      - if: steps.snapshot.outputs.build == 'true'
        run: |
          cp -R web dist
          cp snapshot.json dist/
          python build_browser_data.py inspire_scores.csv.gz dist/data
      - if: steps.snapshot.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
